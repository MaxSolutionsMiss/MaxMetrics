<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MaxMetrics — the departments a plant runs, and what it calls their numbers">
  <title>Configure · MaxMetrics</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="../assets/favicon.svg" color="#5B46D9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/maxmetrics.css?v=871ac39d4a9d">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="rail__brand">
        <span class="rail__mark">
          <svg viewBox="0 0 40 30" aria-hidden="true">
            <path d="M2 28 L13 3 L24 28" fill="none" stroke="#fff" stroke-width="4.4" stroke-linejoin="miter"/>
            <path d="M16 28 L27 3 L38 28" fill="none" stroke="#fff" stroke-width="4.4" stroke-linejoin="miter" opacity=".62"/>
          </svg>
        </span>
        <span class="rail__name">Max<b>Metrics</b></span>
      </div>
      <div class="rail__group">
        <div class="rail__labelrow"><span class="rail__label">Configure</span></div>
        <div id="nav"></div>
      </div>
      <div class="rail__foot">
        <strong id="foot-loc">—</strong>
        <span id="foot-user">—</span>
        <button class="rail__out" id="signout-btn">Sign out</button>
      </div>
    </nav>

    <div class="main">
      <!-- The same chrome as the dashboard: where and when at the top, the one thing
           that changes the plant beside it, and the tools that are used once a month at
           the foot of the page. -->
      <header class="top">
        <select class="top__loc" id="loc" aria-label="Plant"></select>
        <div class="top__date"><b id="pane-title">Departments</b><span id="pane-sub">The shape of this plant</span></div>
        <span class="saved" id="saved"></span>
        <div class="top__spacer"></div>
        <div class="top__actions">
          <a class="btn btn--primary" href="dashboard.html">Back to the dashboard</a>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading this plant…</div>
      </div>
    </div>
  </div>

  <div class="conn" id="conn">Reconnecting…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/departments.js?v=871ac39d4a9d"></script>
</body>
</html>
