<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Metriq — the departments a plant runs, and what it calls their numbers">
  <title>Configure · Metriq</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="../assets/favicon.svg" color="#6C4BB6">
  <link rel="preload" href="../assets/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/metriq.css?v=ce09c25a3f8b">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="rail__brand">
        <span class="rail__mark">
          <svg viewBox="0 0 100 100" aria-hidden="true" fill="none">
            <g transform="rotate(-16 46 44)">
              <path d="M32 71.7 V52" stroke="#fff" stroke-width="5.5"/>
              <path d="M46 75 V44" stroke="#fff" stroke-width="5.5"/>
              <path d="M60 88 V32" stroke="#fff" stroke-width="6.5"/>
            </g>
            <circle cx="46" cy="44" r="30" stroke="#fff" stroke-width="7"/>
          </svg>
        </span>
        <span class="rail__name">metr<b>iq</b></span>
      </div>
      <div class="rail__group">
        <div class="rail__labelrow"><span class="rail__label">Configure</span></div>
        <div id="nav"></div>
      </div>
      <div class="rail__foot">
        <strong id="foot-loc">—</strong>
        <span id="foot-user">—</span>
        <button class="rail__out" id="signout-btn">Sign out</button>
      </div>
    </nav>

    <div class="main">
      <!-- The same chrome as the dashboard: where and when at the top, the one thing
           that changes the plant beside it, and the tools that are used once a month at
           the foot of the page. -->
      <header class="top">
        <select class="top__loc" id="loc" aria-label="Plant"></select>
        <div class="top__date"><b id="pane-title">Departments</b><span id="pane-sub">The shape of this plant</span></div>
        <span class="saved" id="saved"></span>
        <div class="top__spacer"></div>
        <div class="top__actions">
          <a class="btn btn--primary" href="dashboard.html">Back to the dashboard</a>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading this plant…</div>
      </div>
    </div>
  </div>

  <div class="conn" id="conn">Reconnecting…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/departments.js?v=ce09c25a3f8b"></script>
</body>
</html>
