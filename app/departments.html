<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MaxMetrics — the departments a plant runs, and what it calls their numbers">
  <title>Configure departments · MaxMetrics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/maxmetrics.css?v=e727b8a5d82f">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="rail__brand">
        <span class="rail__mark">
          <svg viewBox="0 0 40 30" aria-hidden="true">
            <path d="M2 28 L13 3 L24 28" fill="none" stroke="#fff" stroke-width="4.4" stroke-linejoin="miter"/>
            <path d="M16 28 L27 3 L38 28" fill="none" stroke="#fff" stroke-width="4.4" stroke-linejoin="miter" opacity=".62"/>
          </svg>
        </span>
        <span class="rail__name">Max<b>Metrics</b></span>
      </div>
      <div class="rail__group">
        <div class="rail__labelrow"><span class="rail__label">Configure</span></div>
        <div id="nav">
          <a class="rail__link" href="dashboard.html" title="Daily dashboard">
            <svg class="rail__ico" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>
            <span class="rail__txt">Daily dashboard</span>
            <span class="rail__dot rail__dot--none"></span>
          </a>
          <a class="rail__link" href="departments.html" aria-current="true" title="Departments">
            <svg class="rail__ico" viewBox="0 0 24 24"><path d="M4 20V9l5 3V9l5 3V4l6 4v12z"/></svg>
            <span class="rail__txt">Departments</span>
            <span class="rail__dot rail__dot--none"></span>
          </a>
        </div>
      </div>
      <div class="rail__foot">
        <strong id="foot-loc">—</strong>
        <span id="foot-user">—</span>
      </div>
    </nav>

    <div class="main">
      <header class="top">
        <select class="top__loc" id="loc" aria-label="Location"></select>
        <div class="top__date"><b>Departments</b><span>The shape of this plant</span></div>
        <span class="saved" id="saved"></span>
        <div class="top__spacer"></div>
        <div class="top__actions">
          <a class="btn btn--primary" id="back-btn" href="dashboard.html">Back to the dashboard</a>
          <button class="btn" id="theme-btn">Theme</button>
          <button class="btn" id="signout-btn">Sign out</button>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading this plant…</div>
      </div>
    </div>
  </div>

  <div class="conn" id="conn">Reconnecting…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/departments.js?v=e727b8a5d82f"></script>
</body>
</html>
