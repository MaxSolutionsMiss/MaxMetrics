<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Metriq — the departments a plant runs, and what it calls their numbers">
  <title>Configure · Metriq</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="../assets/favicon.svg" color="#6C4BB6">
  <link rel="preload" href="../assets/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/metriq.css?v=0e9e35ec2bef">
</head>
<body>
  <div class="shell">
    <nav class="modrail" aria-label="Modules">
      <span class="modrail__mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" aria-hidden="true" fill="none">
            <g transform="rotate(-16 46 44)">
              <path d="M32 71.7 V52" stroke="#fff" stroke-width="5.5"/>
              <path d="M46 75 V44" stroke="#fff" stroke-width="5.5"/>
              <path d="M60 88 V32" stroke="#fff" stroke-width="6.5"/>
            </g>
            <circle cx="46" cy="44" r="30" stroke="#fff" stroke-width="7"/>
          </svg>
      </span>
      <a class="mod" href="./dashboard.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v6H4z"/><path d="M14 5h6v4h-6z"/><path d="M14 12h6v7h-6z"/><path d="M4 14h7v5H4z"/></svg><span>Dashboards</span>
      </a>
      <a class="mod" href="./kpi.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.3"/><path d="M15.2 15.2 L20 20"/><path d="M8 12.5v-2"/><path d="M10.7 12.5V9"/><path d="M13.3 12.5V7.6"/></svg><span>KPIs</span>
      </a>
      <button class="mod mod--soon" type="button" disabled aria-disabled="true" title="People — not built yet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.4"/><path d="M3.4 19.2c0-3.1 2.5-5.6 5.6-5.6s5.6 2.5 5.6 5.6"/><path d="M16.2 6.2a3.2 3.2 0 010 5.6"/><path d="M17.6 19.2c0-2-.7-3.6-1.7-4.7"/></svg><span>People</span>
      </button>
      <a class="mod" href="./departments.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.6v2.2M12 18.2v2.2M20.4 12h-2.2M5.8 12H3.6M17.9 6.1l-1.6 1.6M7.7 16.3l-1.6 1.6M17.9 17.9l-1.6-1.6M7.7 7.7 6.1 6.1"/></svg><span>Settings</span>
      </a>
      <span class="modrail__gap"></span>
    </nav>
    <nav class="rail" aria-label="Sections">
      <div class="rail__brand">
        <span class="rail__name">Dashboards</span>
      </div>
      <div class="rail__group">
        <div class="rail__labelrow"><span class="rail__label">Configure</span></div>
        <div id="nav"></div>
      </div>
      <div class="rail__foot">
        <strong id="foot-loc">—</strong>
        <span id="foot-user">—</span>
        <button class="rail__out" id="signout-btn">Sign out</button>
      </div>
    </nav>

    <div class="main">
      <!-- The same chrome as the dashboard: where and when at the top, the one thing
           that changes the plant beside it, and the tools that are used once a month at
           the foot of the page. -->
      <header class="top">
        <select class="top__loc" id="loc" aria-label="Plant"></select>
        <div class="top__date"><b id="pane-title">Departments</b><span id="pane-sub">The shape of this plant</span></div>
        <span class="saved" id="saved"></span>
        <div class="top__spacer"></div>
        <div class="top__actions">
          <a class="btn btn--primary" href="dashboard.html">Back to the dashboard</a>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading this plant…</div>
      </div>
    </div>
  </div>

  <div class="conn" id="conn">Reconnecting…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/departments.js?v=0e9e35ec2bef"></script>
</body>
</html>
