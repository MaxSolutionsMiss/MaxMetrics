<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MaxMetrics daily plant dashboard">
  <title>Daily dashboard · MaxMetrics</title>
  <!-- Barlow and Barlow Condensed are the faces the plant's own dashboard asks for. It
       never loaded them — a single file on a network share had nowhere to load them from —
       so it fell through to Arial Narrow, and the look was an accident of what Windows
       happened to have. Loading them makes every desk and the meeting-room TV agree, and
       the stack still falls back to Arial Narrow if the plant is offline. -->
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="mask-icon" href="../assets/favicon.svg" color="#5B46D9">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/maxmetrics.css?v=7d7861f55967">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <div class="rail__brand">
        <span class="rail__mark">
          <svg viewBox="0 0 40 30" aria-hidden="true">
            <path d="M2 28 L13 3 L24 28" fill="none" stroke="#fff" stroke-width="4.4" stroke-linejoin="miter"/>
            <path d="M16 28 L27 3 L38 28" fill="none" stroke="#fff" stroke-width="4.4" stroke-linejoin="miter" opacity=".62"/>
          </svg>
        </span>
        <span class="rail__name">Max<b>Metrics</b></span>
      </div>
      <div class="rail__group">
        <div class="rail__labelrow">
          <span class="rail__label">Daily dashboard</span>
          <button class="rail__collapse" id="rail-btn" aria-label="Collapse menu">
            <svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg>
          </button>
        </div>
        <div id="nav"></div>
      </div>
      <div class="rail__foot">
        <strong id="foot-loc">—</strong>
        <span id="foot-user">—</span>
        <button class="rail__out" id="signout-btn">Sign out</button>
      </div>
    </nav>

    <div class="main">
      <!-- Where and when, then the two things that change the morning and the one that
           shows it. Entering data and publishing were three buttons and a save indicator;
           they are two, and Publish writes. The chart-style picker used to sit up here;
           there is no longer a chart style to pick — each reading is drawn the way that
           reading is best read, which is a decision the product makes, not the reader. -->
      <header class="top">
        <select class="top__loc" id="loc" aria-label="Plant"></select>
        <div class="top__date"><b id="date-long">—</b><span id="date-rel">—</span></div>
        <input class="date-inp" type="date" id="date" aria-label="Dashboard date">
        <span class="who" id="who" aria-label="People on this dashboard"></span>
        <span class="saved" id="saved"></span>
        <div class="top__spacer"></div>
        <div class="top__actions">
          <span class="chip" id="status">—</span>
          <!-- The coordinator finishes keying the timesheets into the DOR at about half
               past seven and then comes here. One button, where she already is, rather
               than Configure → Data → drop. -->
          <button class="btn btn--primary" id="pull-btn">Pull data</button>
          <button class="btn" id="edit-btn">Edit mode</button>
          <button class="btn btn--go hide" id="publish-btn">Publish</button>
          <button class="btn btn--primary" id="tv-btn">Present</button>
        </div>
      </header>
      <div class="content" id="content">
        <div class="loading">Loading the morning…</div>
      </div>
    </div>
  </div>

  <!-- The importer. Nothing here writes until somebody has seen what it read. -->
  <dialog class="sheet" id="import-sheet" aria-label="Import the morning's files">
    <form method="dialog" class="sheet__head">
      <h2 class="sheet__title">Import a morning</h2>
      <button class="btn" value="cancel">Close</button>
    </form>
    <div class="sheet__body" id="import-body"></div>
  </dialog>

  <div class="tvbar">
    <button class="btn" id="tv-prev" aria-label="Previous section">‹</button>
    <button class="btn" id="tv-next" aria-label="Next section">›</button>
    <div class="tvbar__split"></div>
    <button class="btn" id="tv-play" aria-label="Rotate every 18 seconds">▶</button>
    <button class="btn" id="tv-mode" aria-label="Switch between the walk, one page and the overview">One page</button>
    <button class="btn" id="tv-exit">Exit</button>
  </div>
  <div class="conn" id="conn">Reconnecting…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.52.1/dist/umd/supabase.min.js"></script>
  <script type="module" src="../js/pages/dashboard.js?v=7d7861f55967"></script>
</body>
</html>
