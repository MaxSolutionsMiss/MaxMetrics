name: Verify and deploy MaxMetrics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Architecture rules
        run: node scripts/verify-maxmetrics.mjs

      - name: Every module parses
        run: |
          for file in $(find js -name '*.js'); do
            node --check "$file" || exit 1
          done

      - name: Prepare static site
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp -R app assets js _site/
          # Without a cache stamp a deploy changes no URL, so a browser keeps serving the
          # stylesheet and modules it already has and a plain reload shows the previous
          # release. Applied to the copied tree only, so the source keeps clean paths.
          # Import specifiers are stamped too: versioning the <script> tag alone would
          # leave every module it imports cached.
          v="$(git rev-parse --short=12 HEAD)"
          find _site -name '*.html' -print0 \
            | xargs -0 sed -i -E "s#(href=\"(\.\./)?assets/maxmetrics\.css)\"#\1?v=$v\"#g; s#(src=\"(\.\./)?js/[^\"]*\.js)\"#\1?v=$v\"#g"
          find _site/js -name '*.js' -print0 \
            | xargs -0 sed -i -E "s#(from '\.\.?/[^']+\.js)'#\1?v=$v'#g"
          # The Supabase CDN tag is not ours to version.
          if grep -rq 'supabase.min.js?v=' _site; then
            echo "Cache-busting must not touch the Supabase CDN tag." >&2
            exit 1
          fi
          if grep -rqE "from '\.\.?/[^']+\.js'" _site/js; then
            echo "Cache-busting missed an import specifier:" >&2
            grep -rnE "from '\.\.?/[^']+\.js'" _site/js >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
