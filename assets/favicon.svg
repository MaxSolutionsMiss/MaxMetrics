<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Metriq">
  <!-- The rail mark on its violet tile. One drawing at every size: the strokes are thin
       enough that all three bars survive down to 16px, so there is no simplified variant
       to keep in step. The ring is drawn after the bars so it covers their feet.

       Authored on the same 100-unit grid as everywhere else and placed by one transform,
       so it cannot drift: the drawing spans about x 8..76 and y 8..86, centred on (42, 47),
       and 0.58 puts that inside a 64 tile with room to breathe. -->
  <rect width="64" height="64" rx="14" fill="#6C4BB6"/>
  <g transform="translate(7.6 4.7) scale(0.58)" fill="none" stroke="#fff">
    <g transform="rotate(-16 46 44)">
      <path d="M32 71.7 V48" stroke-width="5.5"/>
      <path d="M46 75 V40" stroke-width="5.5"/>
      <path d="M60 88 V28" stroke-width="6.5"/>
    </g>
    <circle cx="46" cy="44" r="30" stroke-width="7"/>
  </g>
</svg>
